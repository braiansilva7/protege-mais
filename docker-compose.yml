name: protege-mais

services:
  db:
    image: postgres:16-alpine
    container_name: protege-mais-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - protege_mais_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    networks:
      - protege-mais

  atlas-db:
    image: postgres:16-alpine
    container_name: protege-mais-atlas-db
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    volumes:
      - protege_mais_atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    networks:
      - protege-mais

  redis:
    image: redis:8.10.0-alpine
    container_name: protege-mais-redis
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - protege_mais_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - protege-mais

  atlas:
    build:
      context: .
      dockerfile: ./infra/atlas/dev/Dockerfile
    container_name: protege-mais-atlas
    user: '1000:1000'
    env_file:
      - .env
    environment:
      TZ: UTC
      PGTZ: UTC
    depends_on:
      db:
        condition: service_healthy
      atlas-db:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - protege-mais

  minio:
    image: minio/minio:latest
    container_name: protege-mais-minio
    command: server /data --console-address ":9001"
    environment:
      TZ: America/Sao_Paulo
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - protege_mais_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - protege-mais

  minio-setup:
    image: minio/mc:latest
    container_name: protege-mais-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb -p local/$$S3_BUCKET || true &&
      mc anonymous set download local/$$S3_BUCKET &&
      mc admin info local
      "
    networks:
      - protege-mais
    restart: 'no'

  manager_api:
    build:
      context: .
      dockerfile: apps/manager_api/Dockerfile
    container_name: protege-mais-manager-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - protege-mais

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: protege-mais-worker
    init: true
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - protege-mais

networks:
  protege-mais:
    name: protege-mais

volumes:
  protege_mais_postgres_data:
  protege_mais_atlas_postgres_data:
  protege_mais_redis_data:
  protege_mais_minio_data:
